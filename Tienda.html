const firebaseConfig = {

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('papeleta_cart') || '[]');
            const countEl = document.getElementById('cart-count');
            if (countEl) {
                countEl.textContent = cart.length;

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            if (currentUser && myAssignedProductIds.has(productId)) { 
                window.location.href = 'AreaCliente.html'; 
                return; 
            }
            let cart = JSON.parse(localStorage.getItem('papeleta_cart') || '[]');
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) { 
                showToast('Este producto ya está en tu carrito', 'warning'); 
                return; 
            }
            cart.push({ id: product.id, name: product.name, price: product.price, image: product.image_url });
            localStorage.setItem('papeleta_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast('Producto añadido al carrito', 'success');
        }

        function toggleFilterPanel() {
            const panel = document.getElementById('filter-panel');
            const overlay = document.getElementById('filter-panel-overlay');
            panel.classList.toggle('active');
            overlay.classList.toggle('active');
            if (panel.classList.contains('active')) {
                initPriceSlider();
                buildCategoryFiltersList();
            }
        }

        function initPriceSlider() {
            const minSlider = document.getElementById('min-price-slider');
            const maxSlider = document.getElementById('max-price-slider');
            const minThumb = document.getElementById('min-price-thumb');
            const maxThumb = document.getElementById('max-price-thumb');
            const progress = document.getElementById('price-slider-progress');
            const minDisplay = document.getElementById('min-price-display');
            const maxDisplay = document.getElementById('max-price-display');

            const prices = allProducts.map(p => p.price || 0);
            const maxProductPrice = Math.max(...prices, 100);
            const sliderMax = Math.ceil(maxProductPrice / 10) * 10;
            const sliderMin = 0;
            
            minSlider.min = sliderMin;
            minSlider.max = sliderMax;
            maxSlider.min = sliderMin;
            maxSlider.max = sliderMax;
            
            filterMinPrice = 0;
            filterMaxPrice = sliderMax;
            
            minSlider.value = filterMinPrice;
            maxSlider.value = filterMaxPrice;

            function updateSlider() {
                let minVal = parseInt(minSlider.value);
                let maxVal = parseInt(maxSlider.value);
                const minGap = 5;
                
                if (maxVal - minVal < minGap) {
                    if (document.activeElement === minSlider) {
                        maxVal = Math.min(minVal + minGap, sliderMax);
                        maxSlider.value = maxVal;
                    } else {
                        minVal = Math.max(maxVal - minGap, sliderMin);
                        minSlider.value = minVal;
                    }
                }
                
                const minPercent = ((minVal - sliderMin) / (sliderMax - sliderMin)) * 100;
                const maxPercent = ((maxVal - sliderMin) / (sliderMax - sliderMin)) * 100;

                minThumb.style.left = minPercent + '%';
                maxThumb.style.left = maxPercent + '%';
                progress.style.left = minPercent + '%';
                progress.style.width = (maxPercent - minPercent) + '%';

                minDisplay.textContent = '$' + minVal.toFixed(2);
                maxDisplay.textContent = '$' + maxVal.toFixed(2);

                filterMinPrice = minVal;
                filterMaxPrice = maxVal;
            }

            minSlider.addEventListener('input', updateSlider);
            maxSlider.addEventListener('input', updateSlider);
            minSlider.addEventListener('change', () => renderProducts());
            maxSlider.addEventListener('change', () => renderProducts());

            let isDraggingMin = false;
            let isDraggingMax = false;
            const sliderWrapper = document.querySelector('.price-slider-wrapper');

            minThumb.addEventListener('mousedown', (e) => { isDraggingMin = true; e.preventDefault(); });
            maxThumb.addEventListener('mousedown', (e) => { isDraggingMax = true; e.preventDefault(); });
            
            document.addEventListener('mouseup', () => {
                if (isDraggingMin || isDraggingMax) renderProducts();
                isDraggingMin = false;
                isDraggingMax = false;
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDraggingMin && !isDraggingMax) return;
                const rect = sliderWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(100, (x / rect.width) * 100));
                const value = sliderMin + (percent / 100) * (sliderMax - sliderMin);

                if (isDraggingMin) minSlider.value = Math.round(value);
                else if (isDraggingMax) maxSlider.value = Math.round(value);
                updateSlider();
            });

            updateSlider();
        }

        function buildCategoryFiltersList() {
            const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
            const container = document.getElementById('category-filters-list');
            
            container.innerHTML = cats.map(cat => `
                <div class="category-checkbox">
                    <input type="checkbox" id="cat-${cat}" value="${cat}" ${selectedCategories.includes(cat) ? 'checked' : ''}>
                    <label for="cat-${cat}">${cat}</label>
                </div>
            `).join('');
            
            const hasFreeProducts = allProducts.some(p => p.price === 0);
            if (hasFreeProducts) {
                container.innerHTML += `
                    <div class="category-checkbox">
                        <input type="checkbox" id="cat-gratis" value="Gratis" ${selectedCategories.includes('Gratis') ? 'checked' : ''}>
                        <label for="cat-gratis">Gratis</label>
                    </div>
                `;
            }

            container.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) {
                        if (!selectedCategories.includes(checkbox.value)) selectedCategories.push(checkbox.value);
                    } else {
                        selectedCategories = selectedCategories.filter(c => c !== checkbox.value);
                    }
                    renderProducts();
                });
            });
        }

        function clearFilters() {
            const minSlider = document.getElementById('min-price-slider');
            const maxSlider = document.getElementById('max-price-slider');
            
            filterMinPrice = 0;
            filterMaxPrice = Math.max(...allProducts.map(p => p.price || 0), 100);
            
            minSlider.value = filterMinPrice;
            maxSlider.value = filterMaxPrice;
            selectedCategories = [];
            
            document.getElementById('min-price-display').textContent = '$0.00';
            document.getElementById('max-price-display').textContent = '$' + filterMaxPrice.toFixed(2);
            document.getElementById('price-slider-progress').style.left = '0%';
            document.getElementById('price-slider-progress').style.width = '100%';
            document.getElementById('min-price-thumb').style.left = '0%';
            document.getElementById('max-price-thumb').style.left = '100%';
            
            document.querySelectorAll('.category-checkbox input[type="checkbox"]').forEach(cb => cb.checked = false);
            renderProducts();
        }

        function changeImage(direction) {
            if (!currentDetailProduct || !currentDetailProduct.images) return;
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = currentDetailProduct.images.length - 1;
            else if (currentImageIndex >= currentDetailProduct.images.length) currentImageIndex = 0;
            updateGallery();
        }

        function updateGallery() {
            if (!currentDetailProduct || !currentDetailProduct.images) return;
            document.getElementById('detail-image').src = currentDetailProduct.images[currentImageIndex];
            const thumbElements = document.getElementById('gallery-thumbnails').querySelectorAll('.gallery-thumbnail');
            thumbElements.forEach((thumb, idx) => {
                if (idx === currentImageIndex) thumb.classList.add('active');
                else thumb.classList.remove('active');
            });
        }

        function showProductDetails(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            currentDetailProduct = product;
            currentImageIndex = 0;
            
            document.getElementById('detail-title').textContent = product.name;
            const priceDisplay = Number(product.price) === 0 ? 'GRATIS' : '$' + Number(product.price).toFixed(2);
            document.getElementById('detail-price').textContent = priceDisplay;
            
            const mainImage = document.getElementById('detail-image');
            const thumbnailsContainer = document.getElementById('gallery-thumbnails');
            
            if (product.images && product.images.length > 0) {
                mainImage.src = product.images[0];
                thumbnailsContainer.innerHTML = product.images.map((img, idx) => 
                    `<img src="${img}" alt="Imagen ${idx + 1}" class="gallery-thumbnail ${idx === 0 ? 'active' : ''}" onclick="jumpToImage(${idx})">`
                ).join('');
                document.getElementById('gallery-prev').style.display = product.images.length > 1 ? 'flex' : 'none';
                document.getElementById('gallery-next').style.display = product.images.length > 1 ? 'flex' : 'none';
            } else {
                mainImage.src = product.image_url || 'https://via.placeholder.com/400x300';
                thumbnailsContainer.innerHTML = '';
            }

            const description = product.description || 'Sin descripción disponible.';
            document.getElementById('detail-description').innerHTML = `<p>${description}</p>`;
            
            const buyBtn = document.getElementById('detail-buy-btn');
            const alreadyOwned = currentUser && myAssignedProductIds.has(product.id);
            
            if (alreadyOwned) {
                buyBtn.innerHTML = '<i class="fas fa-book text-xl"></i> Biblioteca';
                buyBtn.className = 'w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-green-900/30 text-lg';
                buyBtn.onclick = () => { closeProductDetailModal(); window.location.href = 'AreaCliente.html'; };
            } else if (currentUser) {
                if (Number(product.price) === 0) {
                    buyBtn.innerHTML = '<i class="fas fa-gift text-xl"></i> Reclamar Gratis';
                    buyBtn.className = 'w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-green-900/30 text-lg';
                    buyBtn.onclick = () => { addToCart(productId); closeProductDetailModal(); };
                } else {
                    buyBtn.innerHTML = '<i class="fas fa-credit-card text-xl"></i> Comprar';
                    buyBtn.className = 'w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-red-900/30 text-lg';
                    buyBtn.onclick = () => { addToCart(productId); closeProductDetailModal(); };
                }
            } else {
                buyBtn.innerHTML = '<i class="fab fa-discord text-xl"></i> Iniciar Sesión para Comprar';
                buyBtn.className = 'w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-red-900/30 text-lg';
                buyBtn.onclick = () => { closeProductDetailModal(); window.location.href = 'Login.html'; };
            }
            
            document.getElementById('product-detail-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function jumpToImage(index) { currentImageIndex = index; updateGallery(); }
        
        function closeProductDetailModal() {
            document.getElementById('product-detail-modal').classList.add('hidden');
            document.body.style.overflow = '';
            currentDetailProduct = null;
            currentImageIndex = 0;
        }

        function buyFromDetail() {
            if (!currentDetailProduct) return;
            if (currentUser && myAssignedProductIds.has(currentDetailProduct.id)) {
                window.location.href = 'AreaCliente.html';
                return;
            }
            if (!currentUser) {
                closeProductDetailModal();
                window.location.href = 'Login.html';
            } else {
                addToCart(currentDetailProduct.id);
                closeProductDetailModal();
            }
        }

        function toggleUserPanel() {
            if (!currentUser) { 
                window.location.href = 'Login.html';
                return; 
            }
            // Aquí podrías abrir un panel lateral si lo necesitas
            // Por ahora solo es un placeholder
        }

        function checkDiscordAuth() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');
            if (accessToken) {
                window.location.hash = '';
                localStorage.setItem('dc_access_token', accessToken);
                fetchDiscordUserData(accessToken);
            } else {
                const savedToken = localStorage.getItem('dc_access_token');
                if (savedToken) fetchDiscordUserData(savedToken);
                else { updateAuthUI(); loadProducts(); }
            }
        }

        function fetchDiscordUserData(token) {
            fetch('https://discord.com/api/users/@me', { headers: { 'Authorization': `Bearer ${token}` }})
            .then(res => { if (!res.ok) throw new Error('Token expirado'); return res.json(); })
            .then(user => {
                currentUser = user;
                document.getElementById('user-name').innerText = user.username;
                if (user.avatar) {
                    document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                }
                
                // Determinar rol
                if (isAdmin(user)) {
                    currentUserRole = 'admin';
                    document.getElementById('user-role-badge').textContent = 'ADMIN';
                    document.getElementById('user-role-badge').className = 'text-[10px] text-red-400 font-bold uppercase tracking-wider';
                } else {
                    const savedData = JSON.parse(localStorage.getItem('papeleta_user_' + user.id) || '{}');
                    if(savedData.role && ['mod', 'staff', 'developer'].includes(savedData.role.toLowerCase())) {
                        currentUserRole = savedData.role;
                        document.getElementById('user-role-badge').textContent = savedData.role.toUpperCase();
                        document.getElementById('user-role-badge').className = 'text-[10px] text-red-400 font-bold uppercase tracking-wider';
                    } else {
                        currentUserRole = 'cliente';
                        document.getElementById('user-role-badge').textContent = 'Cliente';
                        document.getElementById('user-role-badge').className = 'text-[10px] text-green-400 font-bold uppercase tracking-wider';
                    }
                }
                
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-section').classList.remove('hidden');
                loadMyAssignments().then(() => loadProducts());
            })
            .catch(err => { console.error(err); logout(); });
        }

        function updateAuthUI() {
            const savedToken = localStorage.getItem('dc_access_token');
            if (savedToken) {
                fetchDiscordUserData(savedToken);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-section').classList.add('hidden');
            }
        }

        async function loadMyAssignments() {
            myAssignedProductIds = new Set();
            if (!currentUser) return;
            try {
                const snapshot = await db.collection("Clientes").where("discord_id", "==", currentUser.id).get();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.products && Array.isArray(data.products)) {
                        data.products.forEach(product => { if (product.id) myAssignedProductIds.add(product.id); });
                    }
                });
            } catch (error) {
                console.error("Error cargando asignaciones:", error);
            }
        }

        function logout() {
            localStorage.removeItem('dc_access_token');
            currentUser = null;
            currentUserRole = 'user';
            updateAuthUI();
            loadProducts();
        }

        async function loadProducts() {
            try {
                const snapshot = await db.collection("Productos").get();
                const jsonProducts = [];
                snapshot.forEach((doc) => jsonProducts.push(doc.data()));
                allProducts = jsonProducts;
                renderProducts();
            } catch (e) { 
                console.error(e);
                document.getElementById('products-grid').innerHTML = '<p class="text-red-500 text-sm col-span-full text-center py-10">Error al cargar productos</p>';
            }
        }

        function renderProducts() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('products-grid');
            
            const filtered = allProducts.filter(p => {
                const matchesSearch = !search || p.name.toLowerCase().includes(search);
                const price = p.price || 0;
                const matchesPrice = price >= filterMinPrice && price <= filterMaxPrice;
                
                let matchesCategory = true;
                if (selectedCategories.length > 0) {
                    if (selectedCategories.includes('Gratis')) {
                        matchesCategory = price === 0;
                    } else {
                        matchesCategory = selectedCategories.includes(p.category);
                    }
                }
                
                return matchesSearch && matchesPrice && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 text-sm col-span-full text-center py-10">No hay productos que coincidan con los filtros aplicados.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const originalPrice = p.original_price || p.price;
                const currentPrice = p.price;
                const hasDiscount = originalPrice > 0 && currentPrice < originalPrice;
                let priceHtml = '';
                let discountBadge = '';
                
                if (hasDiscount) {
                    const discountPercent = Math.round(((originalPrice - currentPrice) / originalPrice) * 100);
                    const currentPriceDisplay = currentPrice === 0 ? 'GRATIS' : '$' + Number(currentPrice).toFixed(2);
                    priceHtml = `<div class="flex items-baseline gap-2"><span class="text-gray-500 text-sm line-through">$${Number(originalPrice).toFixed(2)}</span><span class="text-2xl font-black text-green-400">${currentPriceDisplay}</span></div>`;
                    discountBadge = `<span class="absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full z-10">-${discountPercent}%</span>`;
                } else {
                    const priceDisplay = Number(currentPrice) === 0 ? 'GRATIS' : '$' + Number(currentPrice).toFixed(2);
                    const priceClass = Number(currentPrice) === 0 ? 'text-green-400' : 'text-red-400';
                    priceHtml = `<span class="text-2xl font-black ${priceClass}">${priceDisplay}</span>`;
                }
                
                const alreadyOwned = currentUser && myAssignedProductIds.has(p.id);
                
                return `
                <div class="bg-[#150a0a] border ${alreadyOwned ? 'border-green-600/50' : 'border-red-950/40'} rounded-2xl overflow-hidden shadow-xl group hover:border-red-600/40 transition-all relative">
                    ${alreadyOwned ? '<span class="absolute top-3 right-3 bg-green-600 text-white text-xs font-bold px-3 py-1 rounded-full z-10"><i class="fas fa-check mr-1"></i>YA LO TIENE</span>' : ''}
                    ${discountBadge}
                    <div class="relative overflow-hidden cursor-pointer" onclick="showProductDetails('${p.id}')">
                        <img src="${escapeHTML(p.image_url || '')}" alt="${escapeHTML(p.name)}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300 bg-[#0d0505]">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#150a0a] to-transparent opacity-60 pointer-events-none"></div>
                    </div>
                    <div class="p-5">
                        <h4 class="text-xl font-bold text-white mb-2">${escapeHTML(p.name)}</h4>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${escapeHTML(p.description || '')}</p>
                        ${p.category ? `<span class="inline-block bg-red-950/60 border border-red-800 text-red-300 text-xs font-bold px-2.5 py-1 rounded-md mb-4">${escapeHTML(p.category)}</span>` : ''}
                        <div class="flex items-center justify-between mb-4">
                            ${priceHtml}
                        </div>
                        ${alreadyOwned ? `
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="window.location.href='AreaCliente.html'" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2"><i class="fas fa-download"></i> Descargar</button>
                                <button onclick="showProductDetails('${p.id}')" class="bg-[#0d0505] hover:bg-[#150a0a] border border-red-800/50 text-gray-300 text-sm font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2"><i class="fas fa-eye"></i> Ver</button>
                            </div>
                        ` : `
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="addToCart('${p.id}')" class="bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-red-900/30"><i class="fas fa-cart-plus"></i> Añadir</button>
                                <button onclick="showProductDetails('${p.id}')" class="bg-[#0d0505] hover:bg-[#1a0a0a] border border-red-800/50 text-gray-300 hover:text-white text-sm font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2"><i class="fas fa-info-circle"></i> Detalles</button>
                            </div>
                        `}
                    </div>
                </div>`;
            }).join('');
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        function showToast(message, type = 'success') {
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                container.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.style.cssText = `background: rgba(20, 10, 10, 0.95); border-left: 4px solid ${type === 'success' ? '#00ff44' : '#ff1a1a'}; color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); transform: translateX(120%); transition: transform 0.3s ease-out; display: flex; align-items: center; gap: 10px; min-width: 250px;`;
            
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            const iconColor = type === 'success' ? '#00ff44' : '#ff1a1a';
            
            toast.innerHTML = `<i class="fas ${icon}" style="font-size: 1.2rem; color: ${iconColor};"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.style.transform = 'translateX(0)', 10);
            setTimeout(() => {
                toast.style.transform = 'translateX(120%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Canvas particles
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 26, 26, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkDiscordAuth();
            initParticles();
            animateParticles();
            updateCartBadge();
        });
    </script>
</body>
</html>
