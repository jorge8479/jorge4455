<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área de Clientes - Iniciar Sesión</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      background-color: #020617;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #5865F2;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #4752c4;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Área de Clientes</h1>
    <p>Inicia sesión con tu cuenta de Discord para copiar tu key y descargar el resource asignado.</p>
    <a class="btn" href="/api/auth/login">Iniciar sesión con Discord</a>
  </main>
</body>
</html>
