        <style>
            :root{ --bg:#050505; --red:#ff1a1a; --red2:#b30000; --border:#2a0a0a; --text:#fff; --panel: rgba(5,5,5,0.8); }
            *{box-sizing:border-box;margin:0;padding:0; font-family: "Consolas", monospace;}
            body{ background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
            
            /* VIDEO DE FONDO */
            #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; opacity: 0.25; pointer-events: none; filter: grayscale(100%) sepia(100%) hue-rotate(320deg) saturate(300%) brightness(0.5); }
            .video-overlay { position: fixed; inset: 0; background: radial-gradient(circle, transparent 20%, #000 90%); z-index: -1; pointer-events: none; }
            #fx-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

            /* LOGO CENTRADO EN LA PANTALLA */
            .global-logo {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%); /* Esto lo centra exactamente */
                width: 250px; /* Tamaño más grande porque está en el centro */
                height: auto;
                z-index: 999;
                opacity: 0.15; /* Transparente para que no estorbe la lectura */
                pointer-events: none; /* Permite hacer clic a través de él */
                filter: drop-shadow(0 0 20px rgba(255, 26, 26, 0.4));
                animation: pulseLogo 4s ease-in-out infinite;
            }
            @keyframes pulseLogo { 
                0%, 100% { opacity: 0.10; transform: translate(-50%, -50%) scale(1); } 
                50% { opacity: 0.25; transform: translate(-50%, -50%) scale(1.05); } 
            }

            /* NAVBAR */
            .nav-ad7 { position:fixed; top:20px; left:50%; transform:translateX(-50%); width:90%; max-width:1100px; background:rgba(0,0,0,0.8); border:1px solid var(--border); border-radius:50px; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; z-index:100; backdrop-filter:blur(10px); box-shadow:0 0 20px rgba(255,26,26,0.2); animation: float 4s ease-in-out infinite; }
            @keyframes float { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -5px); } }
            .nav-ad7 .brand { font-weight:bold; font-size:1.2rem; letter-spacing:2px; color:#fff;}
            .nav-ad7 .brand span { color:var(--red); text-shadow: 0 0 10px var(--red); }
            .nav-ad7 a { color:#94a3b8; text-decoration:none; margin-left:20px; font-size:0.85rem; transition:0.3s;}
            .nav-ad7 a:hover { color:#fff; text-shadow: 0 0 10px var(--red); }

            /* CONTENEDOR Y TARJETAS */
            .wrap{position:relative; z-index:10; max-width:1100px; margin:120px auto 40px auto; padding:0 20px;}
            .card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:30px; box-shadow:0 15px 40px rgba(255,26,26,0.1); backdrop-filter:blur(12px); animation: appear 0.8s ease-out; position: relative; z-index: 20;}
            @keyframes appear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

            h1{font-size:1.8rem; margin-bottom:20px; letter-spacing:1px; color:#fff; border-bottom:1px solid var(--border); padding-bottom:10px;}
            h2{margin:25px 0 15px; font-size:1rem; color:var(--red); letter-spacing:2px; text-transform: uppercase;}

            /* BOTONES E INPUTS */
            .btn{background:linear-gradient(180deg, var(--red2), #550000); color:#fff; border:1px solid var(--red); padding:12px 25px; border-radius:8px; cursor:pointer; font-weight:bold; font-family:inherit; letter-spacing:1px; transition:0.3s; box-shadow:0 0 15px rgba(255,26,26,0.3); text-transform:uppercase; text-decoration: none; display: inline-block; text-align: center;}
            .btn:hover{background:linear-gradient(180deg, var(--red), #990000); box-shadow:0 0 25px rgba(255,26,26,0.8); transform:scale(1.05);}
            .btn.small{padding:8px 15px; font-size:0.85rem; border-radius:6px;}
            
            input[type="text"], input[type="password"], input[type="number"] { width:100%; background:#000; border:1px solid #333; color:#fff; padding:14px; border-radius:8px; font-family:inherit; font-size:0.95rem; outline:none; transition:0.3s; margin-bottom: 15px;}
            input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus { border-color:var(--red); box-shadow:0 0 15px rgba(255,26,26,0.4); }

            /* DROPZONE Y RESULTADOS */
            .drop{border:2px dashed #401010; border-radius:12px; padding:40px; text-align:center; cursor:pointer; transition:0.3s; background:rgba(0,0,0,0.4);}
            .drop:hover{border-color:var(--red); background:rgba(255,26,26,0.1); transform:scale(1.01);}
            .drop.done{border-style:solid; border-color:#10b981; background:rgba(16,185,129,0.05)}
            .drop-title{font-size:1.1rem; margin-bottom:10px;}
            .drop-title b { color: var(--red); }

            .tabs-container { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:10px;}
            .tab-btn { background:transparent; border:1px solid transparent; color:#888; padding:10px 20px; border-radius:8px 8px 0 0; cursor:pointer; font-family:inherit; transition:0.3s; font-weight:bold; font-size:0.85rem;}
            .tab-btn:hover { color:#fff; background:rgba(255,0,0,0.1); }
            .tab-btn.active { color:var(--red); border-color:var(--border); border-bottom-color:transparent; background:rgba(255,26,26,0.1); text-shadow:0 0 10px var(--red);}

            .results{max-height:250px; overflow-y:auto; background:#000; border:1px solid var(--border); border-radius:8px; margin-bottom:20px;}
            .res-row{padding:12px 20px; border-bottom:1px solid #150505; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:0.2s;}
            .res-row:hover{background:rgba(255,26,26,0.1); padding-left:25px;}
            .res-row.sel{background:rgba(255,26,26,0.15); border-left:4px solid var(--red);}
            .res-kind{font-size:0.75rem; color:var(--red); background:rgba(255,0,0,0.1); padding:3px 8px; border-radius:4px; font-weight:bold;}
            .res-val{color:#ccc; font-weight:bold; font-size:0.85rem;}

            .lua{display:none; margin-top:16px; border:1px solid #10b981; border-radius:8px; background:#000; overflow:hidden;}
            .lua-head{display:flex; justify-content:space-between; padding:10px 16px; background:#061a10; font-size:0.8rem; color:#10b981; border-bottom:1px solid #10b981; font-weight:bold;}
            .lua pre{padding:18px; font-size:0.85rem; line-height:1.6; white-space:pre-wrap; word-break:break-word; color:#39ff7a; font-family:"Consolas", monospace; margin: 0;}

            table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem;}
            th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
            th { color: var(--red); text-transform: uppercase; font-size: 0.8rem;}
        </style>

    <script>
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, flakes = [];
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    for (let i = 0; i < 80; i++) flakes.push({ x: Math.random()*width, y: Math.random()*height, s: Math.random()*2+1, v: Math.random()*1.5+0.5, o: Math.random()*0.5+0.1 });
    function animate() {
        ctx.clearRect(0, 0, width, height);
        flakes.forEach(f => {
            f.y += f.v; f.x += Math.sin(f.y*0.01)*0.5;
            if (f.y > height) { f.y = -10; f.x = Math.random()*width; }
            ctx.beginPath(); ctx.arc(f.x, f.y, f.s, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${f.o})`;
            ctx.fill();
        });
        requestAnimationFrame(animate);
    }
    animate();
    </script>
