<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | HXCK CODE SCRIPTS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff1a1a'/%3E%3Cstop offset='1' stop-color='%23cc1b1b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='58' font-weight='900' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Corregido: selector universal * */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary: #ff1a1a;
            --bg-dark: #050507;
        }
        
        body {
            background-color: #050507;
            color: #f3f4f6;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-mesh {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at top, rgba(255,26,26,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(255,26,26,0.1) 0%, transparent 50%);
        }

        .mesh-blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.25;
            animation: float 10s infinite ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #ff1a1a, transparent); }
        .blob-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #cc1b1b, transparent); animation-delay: -5s; }
        .blob-3 { top: 50%; left: 50%; width: 40vw; height: 40vw; background: radial-gradient(circle, #ff4444, transparent); animation-delay: -2.5s; opacity: 0.15; }
        
        @keyframes float { 
            0%, 100% { transform: translate(0, 0) scale(1); } 
            50% { transform: translate(30px, 30px) scale(1.1); } 
        }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .login-card {
            background: rgba(20, 10, 10, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 26, 26, 0.2);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255, 26, 26, 0.1);
        }

        .btn-discord {
            background: #5865F2;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }
        .btn-discord:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="bg-mesh">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <canvas id="particles-canvas"></canvas>
    
    <div class="login-card">
        <div class="mx-auto w-20 h-20 rounded-xl mb-6 shadow-lg border-2 border-red-600 bg-gradient-to-br from-red-500 to-red-800 flex items-center justify-center text-3xl font-black">P</div>
        <h1 class="text-3xl font-black text-white mb-2 tracking-wide uppercase">HXCKS <span class="text-red-400">CODE MTA:SA</span></h1>
        <p id="status-msg" class="text-gray-400 text-sm mb-8">Inicia sesión con Discord para acceder a tus compras, descargar recursos y gestionar licencias.</p>
        
        <button id="discord-btn" onclick="redirectToDiscord()" class="btn-discord w-full text-white font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 transition-all duration-200 transform hover:scale-[1.02] mb-4 cursor-pointer">
            <i class="fab fa-discord text-xl"></i> Continuar con Discord
        </button>
        
        <a href="index.html" class="text-gray-500 hover:text-white text-sm transition-colors inline-flex items-center gap-2 mt-4">
            <i class="fas fa-arrow-left"></i> Volver a la tienda
        </a>
    </div>

    <script>
        // --- Partículas ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 26, 26, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // --- Configuración de Discord OAuth2 ---
        const CLIENT_ID = '1573744217711452281'; 
        // IMPORTANTE: Esta URL debe estar registrada exactamente igual en Discord Developer Portal -> OAuth2 -> Redirects
        const REDIRECT_URI = 'https://jorge4455.vercel.app'; 
        const SCOPES = 'identify email'; // Puedes cambiar a 'identify' si no necesitas el correo

        function redirectToDiscord() {
            const url = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;
            window.location.href = url;
        }

        // --- Procesar el regreso desde Discord ---
        window.addEventListener('DOMContentLoaded', () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');
            const tokenType = fragment.get('token_type');

            if (accessToken) {
                document.getElementById('status-msg').textContent = 'Verificando cuenta de Discord...';
                
                fetch('https://discord.com/api/users/@me', {
                    headers: {
                        authorization: `${tokenType} ${accessToken}`,
                    },
                })
                .then(res => res.json())
                .then(user => {
                    if (user.id) {
                        // Guardar datos del usuario en localStorage para usarlos en index.html
                        localStorage.setItem('discord_user', JSON.stringify(user));
                        // Limpiar el token de la barra de direcciones y redirigir
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => {
                    console.error('Error al obtener usuario:', err);
                    document.getElementById('status-msg').textContent = 'Error al iniciar sesión. Inténtalo de nuevo.';
                });
            }
        });
    </script>
</body>
</html>
