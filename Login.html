<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - HXCKS CODE MTA:SA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #09090b;
            background-image: radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.15) 0%, transparent 50%);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-zinc-100 p-4">

    <div class="glass-panel w-full max-w-md rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Decoración superior roja -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-red-600 to-transparent"></div>

        <!-- Logo y Título -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 mb-4 group">
                <div class="w-10 h-10 rounded-lg bg-red-600/20 border border-red-500/30 flex items-center justify-center group-hover:bg-red-600/30 transition">
                    <i class="fa-solid fa-code text-red-500 text-lg"></i>
                </div>
                <span class="text-white font-black tracking-widest text-xl">HXCKS <span class="text-red-400">CODE</span></span>
            </a>
            <h1 class="text-2xl font-bold text-white mb-2">Acceso al Sistema</h1>
            <p class="text-sm text-zinc-400">Conecta tu cuenta de Discord para gestionar tus scripts y licencias MTA:SA.</p>
        </div>

        <!-- Estado de carga / error -->
        <div id="authStatus" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

        <!-- Botón Discord -->
        <button id="discordLoginBtn" onclick="loginWithDiscord()" class="w-full py-3.5 px-4 bg-[#5865F2] hover:bg-[#4752C4] text-white font-semibold rounded-xl transition flex items-center justify-center gap-3 shadow-lg shadow-[#5865F2]/20 cursor-pointer">
            <i class="fa-brands fa-discord text-xl"></i>
            <span>Continuar con Discord</span>
        </button>

        <div class="mt-6 pt-6 border-t border-zinc-800/80 flex items-center justify-between text-xs text-zinc-500">
            <a href="index.html" class="hover:text-zinc-300 transition flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Volver al inicio
            </a>
            <a href="Tienda.html" class="hover:text-zinc-300 transition">
                Explorar Tienda
            </a>
        </div>
    </div>

    <script>
        const DISCORD_AUTH_URL = 'https://discord.com/oauth2/authorize?client_id=1573744217711452281&response_type=token&redirect_uri=https%3A%2F%2Fjorge4455.vercel.app/Login.html&scope=identify%20email';

        function showStatus(message, type = 'info') {
            const box = document.getElementById('authStatus');
            box.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-zinc-800/70', 'border-zinc-700', 'text-zinc-300');

            if (type === 'error') {
                box.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
            } else if (type === 'success') {
                box.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
            } else {
                box.classList.add('bg-zinc-800/70', 'border-zinc-700', 'text-zinc-300');
            }

            box.innerHTML = message;
        }

        function loginWithDiscord() {
            const btn = document.getElementById('discordLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Redirigiendo a Discord...</span>';
            window.location.href = DISCORD_AUTH_URL;
        }

        async function handleDiscordCallback() {
            const hash = window.location.hash;
            if (!hash || !hash.includes('access_token')) return;

            showStatus('<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verificando cuenta de Discord...', 'info');

            const params = new URLSearchParams(hash.substring(1));
            const accessToken = params.get('access_token');
            const expiresIn = params.get('expires_in');

            if (!accessToken) {
                showStatus('No se recibió un token válido de Discord.', 'error');
                return;
            }

            try {
                const res = await fetch('https://discord.com/api/users/@me', {
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                });

                if (!res.ok) {
                    throw new Error('Error al obtener el perfil de Discord');
                }

                const userData = await res.json();

                const sessionData = {
                    id: userData.id,
                    username: userData.username,
                    global_name: userData.global_name || userData.username,
                    discriminator: userData.discriminator || '0',
                    avatar: userData.avatar,
                    email: userData.email || null,
                    access_token: accessToken,
                    expires_at: Date.now() + (Number(expiresIn || 604800) * 1000)
                };

                localStorage.setItem('hxcks_discord_user', JSON.stringify(sessionData));
                localStorage.setItem('discord_user', JSON.stringify(sessionData));

                // Limpia el hash de la URL para evitar reenvíos accidentales
                history.replaceState(null, '', window.location.pathname + window.location.search);

                showStatus(`<i class="fa-solid fa-circle-check mr-2"></i> Sesión iniciada como <strong>${sessionData.global_name}</strong>. Redirigiendo...`, 'success');

                const redirectTarget = localStorage.getItem('hxcks_redirect_after_login') || 'AreaCliente.html';
                localStorage.removeItem('hxcks_redirect_after_login');

                setTimeout(() => {
                    window.location.href = redirectTarget;
                }, 800);
            } catch (err) {
                console.error(err);
                showStatus('Ocurrió un error al validar tu sesión con Discord. Inténtalo de nuevo.', 'error');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            handleDiscordCallback();
        });
    </script>
</body>
</html>
